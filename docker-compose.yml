services:
  postgres:
    image: postgres:17-alpine
    container_name: kg_postgres
    environment:
      POSTGRES_USER: kg
      POSTGRES_PASSWORD: kg
      POSTGRES_DB: kg
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Habilita btree_gist na criação do volume. A exclusion constraint que
      # impede double-booking (tarefa F0.2) depende dessa extensão.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kg -d kg']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
