name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kg
          POSTGRES_PASSWORD: kg
          POSTGRES_DB: kg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kg -d kg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kg:kg@localhost:5432/kg?schema=public
      # O CI roda sem rede externa e sem gastar dinheiro: sempre contra os mocks.
      PAYMENT_PROVIDER: mock
      MESSAGING_PROVIDER: mock
      BILLING_PROVIDER: mock

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kg
          POSTGRES_PASSWORD: kg
          POSTGRES_DB: kg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kg -d kg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kg:kg@localhost:5432/kg?schema=public
      PAYMENT_PROVIDER: mock
      MESSAGING_PROVIDER: mock
      BILLING_PROVIDER: mock

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
